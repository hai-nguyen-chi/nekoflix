name: CI

# Ba nhánh môi trường đều chạy CÙNG một bộ kiểm tra.
#
# Không nới lỏng cho develop. Một bộ nhẹ hơn ở tầng dưới nghĩa là lỗi chỉ
# lộ ra lúc gộp lên staging — đúng lúc đang chuẩn bị phát hành và không ai
# còn nhớ thay đổi nào gây ra nó.
on:
  pull_request:
    branches: [develop, staging, master]
  push:
    branches: [develop, staging, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Không huỷ giữa chừng trên nhánh môi trường: lịch sử CI của develop /
  # staging / master là bằng chứng "commit này đã xanh", cần đầy đủ.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chặn merge nhảy cóc. Quy tắc này rất dễ quên lúc vội, và hậu quả chỉ
  # lộ ra sau khi đã phát hành: master chứa thứ chưa bao giờ qua staging.
  guard:
    name: Hướng merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra nhánh nguồn hợp lệ
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            master)
              # Chỉ staging (phát hành) hoặc hotfix (sửa khẩn) được vào master
              case "$HEAD" in
                staging|hotfix/*) ;;
                *)
                  echo "::error::'$HEAD' -> master bị chặn."
                  echo "Chỉ 'staging' hoặc 'hotfix/*' được merge vào master."
                  echo "Tính năng phải đi develop -> staging -> master."
                  exit 1 ;;
              esac ;;
            staging)
              # 'master' hợp lệ: sau hotfix phải merge ngược xuống, nếu không
              # lần phát hành sau sẽ ghi đè bản vá và bug sống lại.
              case "$HEAD" in
                develop|master|hotfix/*|release/*) ;;
                *)
                  echo "::error::'$HEAD' -> staging bị chặn."
                  echo "Chỉ 'develop', 'master' (back-merge), 'release/*' hoặc 'hotfix/*'."
                  echo "Nhánh tính năng phải merge vào develop trước."
                  exit 1 ;;
              esac ;;
            develop)
              case "$HEAD" in
                feat/*|fix/*|chore/*|docs/*|refactor/*|test/*|hotfix/*|master|staging) ;;
                *)
                  echo "::error::Tên nhánh '$HEAD' không theo quy ước."
                  echo "Dùng: feat/ fix/ chore/ docs/ refactor/ test/"
                  exit 1 ;;
              esac ;;
          esac
          echo "$HEAD -> $BASE hợp lệ."

  check:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # Gồm cả contract test: producer và consumer có còn nói cùng một
      # ngôn ngữ không. Đây là thứ bắt lỗi breaking change TRƯỚC khi nó
      # ra tới hạ tầng thật ở job dưới.
      - run: pnpm test

  integration:
    name: Smoke test (hạ tầng thật)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Hạ tầng thật, không mock: outbox cần transaction nên bắt buộc có
      # replica set; idempotency cần unique index thật.
      - name: Khởi động hạ tầng
        run: |
          cp .env.example .env
          # Sinh cặp khoá RSA cho JWT — .env.example để trống có chủ đích,
          # khoá ký token không bao giờ được nằm trong repo.
          pnpm gen:secrets
          docker compose -f infra/docker-compose.yml up -d --wait mongo redis nats jaeger mailpit
          docker compose -f infra/docker-compose.yml up mongo-init

      - name: Chạy service nền
        run: |
          node apps/identity-service/dist/main.js     > /tmp/identity.log     2>&1 &
          node apps/notification-service/dist/main.js > /tmp/notification.log 2>&1 &
          node apps/gateway/dist/main.js              > /tmp/gw.log           2>&1 &
          npx wait-on -t 60000 http://localhost:4000/health/ready \
                               http://localhost:4001/health/ready \
                               http://localhost:4007/health/ready

      - run: pnpm smoke

      # Chạy riêng vì nó ÉP một tình huống không xảy ra ở luồng bình thường:
      # cùng một event được giao nhiều lần.
      - run: pnpm verify:idempotency

      - name: Log khi thất bại
        if: failure()
        run: |
          echo "─── gateway ───";              cat /tmp/gw.log           || true
          echo "─── identity-service ───";     cat /tmp/identity.log     || true
          echo "─── notification-service ───"; cat /tmp/notification.log || true
          docker compose -f infra/docker-compose.yml logs --tail=80
