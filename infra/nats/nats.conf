# NATS JetStream — cấu hình cho môi trường dev
#
# Stream và consumer KHÔNG khai báo ở đây — mỗi service tự tạo lúc khởi động
# (packages/service-kit lo), để service tự quản vòng đời consumer của mình.

port: 4222
http_port: 8222

server_name: nekoflix-nats

jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Event payload lớn nhất dự kiến ~100KB (metadata title đầy đủ).
# 2MB là biên an toàn rộng rãi.
max_payload: 2MB

# Đóng kết nối idle lâu để tránh rò socket khi service restart liên tục lúc dev
write_deadline: "10s"

debug: false
trace: false
logtime: true
